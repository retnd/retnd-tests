doc: >
  The state-loss recovery sequence: fetch, lose the database, rebuild the
  catalog from sidecar manifests, then confirm through the product's own
  read surface that the catalog is back. The read-back is the assertion
  that matters, because a rebuild that exits 0 and reconstructs nothing
  would pass an exit-code-only check.
scenario: fresh-local
setup:
  - [fetch, --config, "${CONFIG}", --source, production, --backup-set, app-uploads]
mutate:
  - "rm ${STATE_DB}"
setup_after_mutate:
  - [catalog, rebuild, --config, "${CONFIG}"]
argv: [artifacts, --config, "${CONFIG}"]
exit: 0
stdout:
  - line: "1 artifact(s)"
stderr:
  - line: "mode: direct. No process has announced itself as serving this deployment, so this command answered from ${CONFIG} itself."
  - absent: "mode: engine-attached"
  - count: 1
state: ignored
contract:
  - "docs/EPIC-B-multi-nas.md 19.3 (catalog reconstruction from sidecar recovery manifests)"
  - "docs/recovery.md (state-loss recovery)"
  - 'usage text: status, sources, artifacts and retention read rather than write, so they announce which world the answer is about; "mode: direct" is nothing serving (rclone-manager#536, #544)'
tags: [smoke]
