doc: >
  A fetch against a remote that is not there must leave the catalog
  saying nothing happened. The claim is made through `artifacts` rather
  than by reading the database, because the operator-visible answer to
  "did a backup happen" is the one that matters, and an exit code from the
  failed command would not have proved it.
scenario: unreachable-remote
allow_setup_failure: true
setup:
  - [fetch, --config, "${CONFIG}", --source, production, --backup-set, postgres-primary]
argv: [artifacts, --config, "${CONFIG}"]
exit: 0
stdout:
  - line: "0 artifact(s)"
  - count: 1
stderr:
  - line: "mode: direct. No process has announced itself as serving this deployment, so this command answered from ${CONFIG} itself."
  - absent: "mode: engine-attached"
  - count: 1
state: unchanged
contract:
  - "docs/EPIC.md FR-10 (lifecycle transitions are durable; a cycle that failed records no success)"
  - "docs/EPIC.md FR-22 (retry and error classification)"
  - 'usage text: status, sources, artifacts and retention read rather than write, so they announce which world the answer is about; "mode: direct" is nothing serving (backupd#536, #544)'
tags: [smoke]
