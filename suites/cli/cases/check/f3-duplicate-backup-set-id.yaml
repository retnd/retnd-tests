  - contains: "postgres-primary"
  - re: ".*sources\\[0\\]\\.backup_sets\\[1\\].*"
state: unchanged
contract:
  - "docs/EPIC.md FR-7 (backup-set isolation: identity is source plus set)"
  - "docs/EPIC.md FR-5 (configuration SHALL be validated)"
tags: [smoke]
