  FR-7 makes a backup set's identity source-plus-set. Two sets under one
  source sharing an id are the same set twice, so validation names the
  offending field rather than picking one.
scenario: invalid-duplicate-set
argv: [check, --config, "${CONFIG}"]
exit: 1
stdout: empty
stderr:
