doc: >
  check on a fresh install (retnd#1049). The engine writes a default
  configuration on its first start, so the question check answers here is
  whether it can: a writable configuration directory is a pass, and the
  notice says there is no configuration yet and what to do next.
scenario: no-fixture
argv: [check, --config, "${WORK}/no-such-config.yaml"]
exit: 0
stdout:
  - contains: "config: none yet at ${WORK}/no-such-config.yaml"
  - contains: "config directory writable: yes"
  - contains: "Next step:"
stderr: empty
state: unchanged
contract:
  - "usage text: every command except version accepts --config"
  - "retnd#1049: a user must never meet an error on first install just because something has not been configured yet"
tags: [smoke]
