doc: >
  The command was renamed to `backupd` in 0.3.3 and `backupd` still
  runs, because the image links the old name beside the new one. This
  case drives the build under test through that old filename and requires
  the same four version lines it prints under its own name.

  Nothing an operator runs proves that promise, which is how it rots: the
  Go side of it is one constant nobody reads argv[0] against, so the day
  somebody "fixes" the printed name by taking it from the filename
  instead, every test in the product still passes and the two spellings
  quietly start reporting themselves differently on the same host. This
  case is the outside view of that. `version` is the invocation it makes
  because the binary naming itself is the assertion, and the first line
  below says `backupd` while the file that produced it is called
  `backupd`.

  What this does not prove is that the shipped image contains both names.
  The harness makes the link, so the claim is about the binary, not about
  packaging; container/Dockerfile owns that half.
scenario: no-fixture
invoke_as: backupd
argv: [version]
exit: 0
stdout:
  - re: "backupd \\S+"
  - re: "rclone v\\d+\\.\\d+\\.\\d+\\S*"
  - re: "go go\\d+\\.\\d+(\\.\\d+)?"
  - re: "commit [0-9a-f]{7,40}(-dirty)?"
  - count: 4
stderr: empty
state: unchanged
contract:
  - "core/cliecho/cliname.go: Binary is `backupd`, and `backupd` still runs because the image symlinks it beside this one, so nothing an operator already automated has to change"
  - "usage text: version - report version information"
tags: [smoke]
