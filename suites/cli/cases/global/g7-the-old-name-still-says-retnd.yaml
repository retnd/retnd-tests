doc: >
  The same binary reached under the same retired filename, on the path
  where it has most to say about itself: an unrecognised command, which
  prints the diagnostic prefix and then the whole usage banner. Both name
  the command, and both have to say `retnd` even though `backupd` is what
  was typed.

  This is the case that would go red on the reasonable-looking change
  cliname.go argues against, taking the printed name from argv[0]. Under
  that change an operator whose automation still calls the old filename
  would be told they are running a command that has not existed since
  R1.3 (backupd#888), and `global/g2-unknown-command` beside this one
  would stay green throughout, because it drives the binary under the name
  the pin resolved.

  The one-sided nature of that is the point. The old name is gone from the
  image, so a host can only reach this build through `backupd` by way of a
  link somebody made — and the answer it gets back has to be the name that
  still exists, because the whole reason R1.3 refused to alias the old
  spelling is that two names reporting themselves differently is how a
  rename never finishes.
scenario: no-fixture
invoke_as: backupd
argv: [frobnicate]
exit: 2
stdout: empty
stderr:
  - line: 'retnd: unknown command "frobnicate"'
  - line: "usage: retnd <command> [flags]"
state: unchanged
contract:
  - "core/cliecho/cliname.go: what this binary calls itself is a fact about the build, not about how somebody reached it; taking the printed name from argv[0] would make two spellings print differently in two shells on the same host"
  - "usage text: the binary's own usage banner"
  - "exit-code convention: 2 is a usage error"
tags: [smoke]
