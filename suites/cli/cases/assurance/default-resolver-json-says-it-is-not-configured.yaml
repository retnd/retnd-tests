doc: >
  The same default through --json, which is the shape the API serves:
  configured is false, and the four host-scoped knobs are listed with per_set
  false: staging_root, staging_ttl, max_concurrent_full_reads and
  max_per_destination (core/service/assurance.go, assuranceHostKnobs). The
  list used to name web_download_memory_bytes too, and the product does not
  list it any more, so the case follows the four it does. A script can tell a
  deployment that chose its policy from one that inherited it, and the zero
  value is never mistaken for a choice (FR-73).
scenario: seeded-local
argv: ["settings", "assurance", "--json", "--config", "${CONFIG}"]
exit: 0
stdout:
  - contains: "\"configured\": false"
  - contains: "\"per_set\": false"
  - contains: "\"name\": \"staging_root\""
  - contains: "\"name\": \"staging_ttl\""
  - contains: "\"name\": \"max_concurrent_full_reads\""
  - contains: "\"name\": \"max_per_destination\""
stderr: empty
state: unchanged
contract:
  - "FR-73"
  - "usage text: settings assurance --json prints the body the API serves"
