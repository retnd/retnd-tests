doc: >
  FR-18's formula partitions a backup set's managed complete backups into
  exactly two groups: KEEP is the union of every tier's selections plus
  FR-19's protected term, and DELETE is everything the union did not
  claim. So a preview over six artifacts itemises six artifacts, each
  exactly once, each with a verdict, and the one carrying FR-19's
  last-known-good protection is on the KEEP side.

  What this case deliberately does not pin is which artifacts land where.
  FR-18 defines calendar buckets but never says which timestamp puts an
  artifact in one, the backup's own date or the moment this manager
  received it, and the two readings give different answers for this
  fixture. Asserting one of them would be asserting a choice the contract
  has not made. The question is filed as
  spdrman/rclone-manager#192 and recorded in findings/DISC-006.md, and
  this case is written to survive either answer.
scenario: retention-shape
argv: [retention, --config, "${CONFIG}", --dry-run]
exit: 0
stdout:
  - line: "production/postgres-primary:"
  - re: "\\s+(KEEP|DELETE)\\s+pg-age-000d\\.dump\\s+tiers=\\[.*\\]"
  - re: "\\s+(KEEP|DELETE)\\s+pg-age-003d\\.dump\\s+tiers=\\[.*\\]"
  - re: "\\s+(KEEP|DELETE)\\s+pg-age-020d\\.dump\\s+tiers=\\[.*\\]"
  - re: "\\s+(KEEP|DELETE)\\s+pg-age-050d\\.dump\\s+tiers=\\[.*\\]"
  - re: "\\s+(KEEP|DELETE)\\s+pg-age-200d\\.dump\\s+tiers=\\[.*\\]"
  - re: "\\s+(KEEP|DELETE)\\s+pg-age-500d\\.dump\\s+tiers=\\[.*\\]"
  - re: "\\s+KEEP\\s+\\S+\\s+tiers=\\[.*LAST_KNOWN_GOOD.*\\]"
  - re: "\\s+last-known-good: artifact \"\\S+\" is the newest eligible restore point in this backup set and holds FR-19 last-known-good protection"
  # One header, six itemised artifacts, one last-known-good note. An
  # artifact itemised twice, or one silently left out of the preview,
  # fails here regardless of what verdict it would have carried.
  - count: 8
stderr: empty
state: unchanged
contract:
  - "docs/EPIC.md FR-18 (KEEP is the union of tier selections plus the protected term; DELETE is everything managed and complete that the union did not claim)"
  - "docs/EPIC.md FR-19 (the newest known-good restore point SHALL NOT be deleted solely for age)"
  - "usage text: retention [--dry-run] ... preview GFS/last-known-good retention decisions"
tags: [smoke]
