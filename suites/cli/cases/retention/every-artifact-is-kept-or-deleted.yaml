doc: >
  FR-18's formula partitions a backup set's managed complete backups into
  exactly two groups: KEEP is the union of every tier's selections plus
  FR-19's protected term, and DELETE is everything the union did not
  claim. So a preview over six artifacts itemises six artifacts, each
  exactly once, each with a verdict, and the one carrying FR-19's
  last-known-good protection is on the KEEP side.

  This case pins the partition and nothing else. Which artifacts land
  where is a different claim with a different fixture, and it is
  retention/gfs-tiers-from-one-ingest's: pinning both here would send this
  one red whenever a tier window moved, which has nothing to do with
  whether the itemisation is a partition. What is asserted per artifact is
  therefore only that it appears once, with a verdict and a tier list.

  It used to be written this way for a different reason. FR-18 defined
  calendar buckets and never said which timestamp put an artifact in one,
  the backup's own date or the moment this manager received it, and the
  two readings gave different answers for this fixture. That question was
  filed as spdrman/backupd#192 and settled by #215: FR-18 now
  places every artifact twice and unions the results, and this fixture's
  six artifacts no longer collapse into one bucket.

  The count is the load-bearing line. An artifact itemised twice, or one
  silently left out of the preview, fails here regardless of what verdict
  it would have carried, which is the property a partition actually has.
scenario: retention-shape
argv: [retention, --config, "${CONFIG}", --dry-run]
exit: 0
stdout:
  - line: "production/postgres-primary:"
  - re: "\\s+(KEEP|DELETE)\\s+pg-age-000d\\.dump\\s+tiers=\\[.*\\]"
  - re: "\\s+(KEEP|DELETE)\\s+pg-age-003d\\.dump\\s+tiers=\\[.*\\]"
  - re: "\\s+(KEEP|DELETE)\\s+pg-age-020d\\.dump\\s+tiers=\\[.*\\]"
  - re: "\\s+(KEEP|DELETE)\\s+pg-age-050d\\.dump\\s+tiers=\\[.*\\]"
  - re: "\\s+(KEEP|DELETE)\\s+pg-age-200d\\.dump\\s+tiers=\\[.*\\]"
  - re: "\\s+(KEEP|DELETE)\\s+pg-age-500d\\.dump\\s+tiers=\\[.*\\]"
  - re: "\\s+KEEP\\s+\\S+\\s+tiers=\\[.*LAST_KNOWN_GOOD.*\\]"
  # FR-19 requires the reason an operator reads to carry the resolved
  # date and to say which of the two timestamps produced it, so both are
  # asserted rather than skipped over with a wildcard. The date itself is
  # a ${TS}: it is the fixture's own mtime and moves with every run.
  - line: "${SP}last-known-good: artifact \"${ANY}\" is the newest eligible restore point in this backup set, dated ${TS} by the producer's own timestamp on the remote object, and holds FR-19 last-known-good protection"
  # One header, six itemised artifacts, one last-known-good note.
  - count: 8
stderr:
  - line: "mode: direct. No process has announced itself as serving this deployment, so this command answered from ${CONFIG} itself."
  - absent: "mode: engine-attached"
  - count: 1
state: unchanged
contract:
  - "docs/EPIC.md FR-18 (KEEP is the union of tier selections plus the protected term; DELETE is everything managed and complete that the union did not claim)"
  - "docs/EPIC.md FR-19 (the newest known-good restore point SHALL NOT be deleted solely for age, and the reason carries the resolved date and its provenance)"
  - "usage text: retention [--dry-run] ... preview GFS/last-known-good retention decisions"
  - 'usage text: status, sources, artifacts and retention read rather than write, so they announce which world the answer is about; "mode: direct" is nothing serving (backupd#536, #544)'
tags: [smoke]
