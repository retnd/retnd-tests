doc: >
  The positive control for the case above. While FR-20 deletion is
  unimplemented, plain `retention` has to say so on its own output rather
  than looking like it applied something. If that note ever disappears
  without deletion arriving, this goes red.
scenario: seeded-local
argv: [retention, --config, "${CONFIG}"]
exit: 0
stdout:
  - contains: "not implemented"
  - contains: "issue #21"
  - contains: "preview only"
stderr: empty
state: unchanged
contract:
  - "docs/EPIC.md FR-20 (local deletion safety)"
  - "the binary's own note on plain retention output"
tags: [smoke]
