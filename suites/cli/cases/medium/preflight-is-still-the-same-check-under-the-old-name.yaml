doc: >
  `medium preflight` goes on working, and answers exactly what `medium
  test-connection` answers (spdrman/rclone-manager#622).

  The rename is the point of the issue's naming half: the same idea was
  called "Verify" in the web UI, `preflight` here and "Test connection" on
  the source side of the same product, which is one operator learning
  three words for one button. What must NOT come with a rename is a break:
  `preflight` is in shell scripts and deployment steps written against it,
  and its removal would buy nobody anything.

  So this case drives the old verb against the destination the NEW verb
  made checkable, which is the sharpest form the alias claim has. If the
  two names were two implementations, this is where they would part: local
  is the id the old verb used to refuse outright, so an alias that only
  covered the declared mediums would fail here and nowhere else.

  It is a working alias and not a deprecation, so nothing here asserts a
  warning and the absence of one is asserted. A line telling an operator
  to move off a verb that is not going anywhere would be a change to the
  output of every script that already calls it.
scenario: storage-destinations
argv: [medium, preflight, local, --config, "${CONFIG}"]
exit: 0
stdout:
  - line: "storage medium local: ready for a backup"
  - line: "${SP}reach${SP}passed${SP}The directory this deployment's backups land in is there and is a directory."
  - re: "\\s+space\\s+passed\\s+The filesystem this deployment's backups land on has .* available\\."
  - line: "${SP}delete${SP}passed${SP}The probe file was deleted, so this check left nothing behind."
  - absent: "deprecat"
  - absent: "renamed"
stderr: empty
state: unchanged
contract:
  - "usage text: medium test-connection - One check, two verbs, one implementation: preflight is kept as an alias so anything scripted against it goes on working"
  - "spdrman/rclone-manager#622: test connection is called \"Test connection\" wherever it appears, with `preflight` kept as a CLI alias"
tags: [smoke]
