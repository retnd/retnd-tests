doc: >
  The drive this deployment's backups land on is refused for the reason
  it actually has: copies are on it
  (spdrman/backupd#670, FR-30).

  This case used to assert that local "was never declared" and so "cannot
  be un-declared". That was true when it was written (#622) and stopped
  being true with #670: local is a DECLARED destination now, instance
  zero of the local_volume backend, written into storage_mediums at first
  boot and proven before it is written. Its undeletability is no longer a
  fact about its name — it falls out of the same two general rules every
  other destination gets, which is what #670 asks for in as many words.

  So this asserts the rule that actually stops the removal here. The
  scenario has a backup on the local drive, and FR-30 refuses to
  un-declare a destination artifacts already live on: removing the
  declaration would not delete them, it would leave this deployment with
  no way to confirm they exist. The refusal names the count and the
  backup set, because "1 copy affected" with nothing named is a number
  rather than something an operator can act on.

  The default is deliberately moved OFF local in the setup, and that is
  what makes this case about FR-30 rather than about the mark. Before
  #670 that step made no difference, because the refusal was about the id
  either way. Now it does: the destination that carries the mark is
  refused by the case beside this one, and local with the mark moved away
  is an ordinary destination refused by an ordinary rule. A local drive
  with nothing on it and no mark on it is removable, which is #670's own
  acceptance and not something this case can assert without a scenario
  that has never taken a backup.
scenario: storage-destinations
setup:
  - [medium, default, offsite_s3, --config, "${CONFIG}"]
argv: [medium, remove, local, --config, "${CONFIG}"]
exit: 1
stdout:
  - contains: "mode: direct"
stderr:
  - contains: "storage medium still holds copies"
  - contains: "1 copy on storage medium \"local\""
  - contains: "production/postgres-primary"
  - contains: "the only confirmed copy of their artifact anywhere"
state: unchanged
contract:
  - "usage text: medium remove <medium-id> - un-declare a destination. Refused while any copy names it"
  - "spdrman/backupd#670: local is a declared destination, undeletable by the general rules rather than by its name"
tags: [smoke]
