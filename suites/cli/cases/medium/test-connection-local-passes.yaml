doc: >
  `medium test-connection local` really tests the drive this deployment's
  backups land on (backupdproject/backupd#622).

  Before it, the local destination had nothing to check: `medium
  preflight local` refused with "this configuration does not declare that
  storage medium", which is true and useless, because local is never
  declared and is the destination an operator is most likely to be on.

  What is asserted is the whole report and never a verdict. A check that
  collapses into one word throws away the diagnosis, so every step is
  named here, in the engine's own order, skipped ones included: a skipped
  write rendered as anything but "this was never tried" would tell an
  operator their drive is writable on the strength of a probe nobody ran.

  Two of the nine steps are skipped rather than passed, and that is the
  part a uniform green would hide: a directory reads no credential, and a
  filesystem has no storage classes for an object to land in the wrong
  one of.

  `space` is the step a bucket has no counterpart for, and it is what
  makes this report the local one rather than the S3 one under a different
  id. Its detail carries a real reading off the filesystem, so the size is
  a ${ANY}: what is contractual is that the step ran and answered.
scenario: storage-destinations
argv: [medium, test-connection, local, --config, "${CONFIG}"]
exit: 0
stdout:
  - ndjson: {event: startup}
  - line: "storage medium local: ready for a backup"
  - line: "${SP}credentials${SP}skipped${SP}a local destination reads no credential: the backups are written by this service to a directory on this machine."
  - line: "${SP}reach${SP}passed${SP}The directory this deployment's backups land in is there and is a directory."
  - line: "${SP}deliverable${SP}passed${SP}A local directory takes delivery of a backup and can read it back immediately, with no restore and no waiting."
  - re: "\\s+space\\s+passed\\s+The filesystem this deployment's backups land on has .* available\\."
  - line: "${SP}write${SP}passed${SP}A probe file was written into the directory this deployment's backups land in, as the user this service runs as."
  - line: "${SP}read_back${SP}passed${SP}The probe file came back byte for byte."
  - line: "${SP}storage_class${SP}skipped${SP}a filesystem has no storage classes, so there is nothing here that could have landed in a different one than the configuration asked for."
  - line: "${SP}verification${SP}passed${SP}A backup here is proven by reading it back, which this check just did. There is nothing that has to be asked of a provider and nothing that costs egress."
  - line: "${SP}delete${SP}passed${SP}The probe file was deleted, so this check left nothing behind."
stderr: empty
state: unchanged
contract:
  - "usage text: medium test-connection <medium-id> - the same check as medium preflight, under the name the rest of this product uses for it"
  - "usage text: medium test-connection - It also answers for \"local\", the drive this deployment's backups land on"
  - "backupdproject/backupd#622: it works on the local hard drive entry and reports a missing path, a permission problem and a full filesystem distinctly"
tags: [smoke]
