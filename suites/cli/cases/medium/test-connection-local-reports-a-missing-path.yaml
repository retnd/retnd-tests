doc: >
  The first of the three local answers #622 asks for, told apart from the
  other two by WHICH STEP failed and by the category on it.

  A drive that is not there fails `reach`, categorised `not_found`, and
  every step after it is skipped rather than passed. That distinction is
  the whole value of the report: a skipped write is "nothing was
  attempted", and an operator who read it as a pass would believe a
  directory that does not exist is writable.

  `space` is skipped here and NOT failed, which is what tells this answer
  apart from the out-of-room one: the check never got far enough to have
  an opinion about free space, and saying so is a different sentence from
  saying there is none.

  Exit 1, so this composes into a deployment script the way `check` and
  `validate` already do.
scenario: local-drive-unmounted
argv: [medium, test-connection, local, --config, "${CONFIG}"]
exit: 1
stdout:
  - line: "storage medium local: NOT ready; see the failing checks below"
  - line: "${SP}reach${SP}failed(not_found)${SP}The directory this deployment's backups land in is not there. On a NAS that is almost always a volume that did not mount: the path is right and nothing is behind it, so a backup would be written into an empty mount point on the system disk."
  - line: "${SP}deliverable${SP}skipped${SP}This was never tried: the directory could not be reached."
  - line: "${SP}space${SP}skipped${SP}This was never tried: the directory could not be reached."
  - line: "${SP}write${SP}skipped${SP}This was never tried: the directory could not be reached."
  - line: "${SP}delete${SP}skipped${SP}This was never tried: nothing was written, so there is nothing to roll back."
  - absent: "ready for a backup"
stderr: empty
state: unchanged
contract:
  - "usage text: medium test-connection - reporting a missing path, a directory the service user cannot write to, and a full filesystem as three different failures"
  - "usage text: medium preflight - Exits non-zero when any check fails (#443)"
  - "backupdproject/backupd#622: it works on the local hard drive entry and reports a missing path, a permission problem and a full filesystem distinctly"
tags: [smoke]
