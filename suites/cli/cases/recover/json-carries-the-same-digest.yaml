doc: >
  --json prints the body the API serves: the artifact id, the byte count, the
  copy and the digest, so a script can compare a recovery against what it
  recorded without parsing prose (FR-67).
scenario: seeded-local
argv: ["recover", "production/postgres-primary/pg-2026-06-01.dump", "--to", "recovered-2", "--json", "--config", "${CONFIG}"]
exit: 0
