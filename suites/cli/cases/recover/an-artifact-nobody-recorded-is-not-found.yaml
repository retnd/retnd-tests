doc: >
  An artifact id the journal has no row for is a not-found refusal with the id
  in it, exit status 1, and nothing minted that could be redeemed. A recovery
  starts from a row the journal holds (FR-67).
scenario: seeded-local
argv: ["recover", "production/postgres-primary/nope.dump", "--to", "-", "--config", "${CONFIG}"]
exit: 1
stdout: empty
stderr:
  - contains: "artifact not found: production/postgres-primary/nope.dump"
state: unchanged
contract:
  - "FR-67 (journal truth stays journal truth)"
